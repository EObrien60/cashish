<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
      }
      .canvas {
        width: 1024px;
        height: 1024px;
        display: grid;
        place-items: center;
      }
      /* macOS squircle, with the standard ~10% transparent margin */
      .tile {
        width: 832px;
        height: 832px;
        border-radius: 188px;
        background:
          radial-gradient(120% 120% at 28% 18%, #1aa37c 0%, #0f7b5f 46%, #0a5c47 100%);
        box-shadow:
          inset 0 6px 14px rgba(255, 255, 255, 0.28),
          inset 0 -24px 60px rgba(0, 0, 0, 0.22),
          0 36px 80px rgba(10, 92, 71, 0.45);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .tile::after {
        /* soft top sheen */
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 42%);
        pointer-events: none;
      }
      svg {
        width: 470px;
        height: 470px;
        position: relative;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.22));
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="tile">
        <!-- coin stack with a euro -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5.5" rx="8" ry="3" fill="rgba(255,255,255,0.12)" />
          <path d="M4 5.5v5c0 1.66 3.58 3 8 3s8-1.34 8-3v-5" />
          <path d="M4 10.5v5c0 1.66 3.58 3 8 3s8-1.34 8-3v-5" />
          <path d="M4 15.5v3c0 1.66 3.58 3 8 3s8-1.34 8-3v-3" />
        </svg>
      </div>
    </div>
  </body>
</html>
