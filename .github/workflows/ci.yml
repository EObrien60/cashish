name: CI

# Gates the merge.
#
# NOTE: merging does NOT deploy. The Vercel project has no GitHub connection
# (`link: null`), so production ships by `vercel --prod` by hand, and the build
# command `npm run db:migrate && npm run build` runs then rather than on merge.
# This is still the last automated check before a human ships, so it is the step
# at which a broken migration or a failing test has to be caught.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The suite runs against real Postgres because that is what production runs.
    # Testing SQLite while shipping Postgres is how a rounding or boolean bug
    # reaches the books unnoticed, which is why the harness refuses anything else.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cashish
          POSTGRES_PASSWORD: cashish
          POSTGRES_DB: cashish_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cashish -d cashish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The harness refuses a DATABASE_URL that does not name a test database, so
      # a misconfigured job fails loudly instead of quietly pointing at real books.
      DATABASE_URL: postgres://cashish:cashish@127.0.0.1:5432/cashish_test
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000000000
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Vercel project's Node version
          cache: npm

      - run: npm ci

      # No tsconfig at the repository root since the workspace split; each
      # workspace is checked against its own.
      - name: Types
        run: |
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p apps/books/tsconfig.json
          npx tsc --noEmit -p apps/admin/tsconfig.json

      # Runs the migrations first via the pretest hook, which also proves the
      # migration path works on an empty database — the thing the Vercel build
      # does to production on every deploy.
      - name: Tests
        run: npm test

      # The console's own suite, including the boundary test that fails if it
      # ever imports the books app, and the auth tests that are the whole
      # argument for a separate platform_admins table.
      - name: Admin tests
        env:
          ADMIN_AUTH_SECRET: ci-admin-secret-distinct-from-the-other-one-000
        run: npm run test:admin

      - name: Build
        run: npm run build

      - name: Build admin
        env:
          ADMIN_AUTH_SECRET: ci-admin-secret-distinct-from-the-other-one-000
        run: npm run build:admin
